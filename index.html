<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kickoff Legends</title>
  <meta name="description" content="Kickoff Legends — cel-shaded 1v1 street football. Play vs AI or a friend on one keyboard. Runs fully offline." />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/fx.css" />
</head>
<body>
  <div id="game"><noscript id="nojs">Kickoff Legends needs JavaScript to run.</noscript></div>
  <span class="font-preload" style="font-family: 'Bangers'">.</span>
  <span class="font-preload" style="font-family: 'Oswald'; font-weight: 700">.</span>
  <span class="font-preload" style="font-family: 'Teko'; font-weight: 600">.क</span>
  <span class="font-preload" style="font-family: 'Teko'; font-weight: 700">.क</span>

  <!-- vendored engine -->
  <script src="js/vendor/phaser.min.js"></script>

  <!-- data + locales (plain JS so file:// works without XHR) -->
  <script src="locales/locales.js"></script>
  <script src="js/data/tuning.js"></script>
  <script src="js/data/characters.js"></script>
  <!-- sliced atlas descriptors (generated by tools/slice-sheet.mjs; harmless if missing) -->
  <script src="assets/images/atlases/atlases.js"></script>
  <!-- living-sky split (generated by tools/sky-split.mjs; harmless if missing) -->
  <script src="assets/images/backgrounds/sky.js"></script>

  <!-- core services -->
  <script src="js/core/I18n.js"></script>
  <script src="js/core/EventBus.js"></script>
  <script src="js/core/HiDPI.js"></script>
  <script src="js/core/Motion.js"></script>
  <script src="js/core/SaveService.js"></script>
  <script src="js/core/Placeholders.js"></script>
  <script src="js/core/Audio.js"></script>
  <script src="js/core/FXLayer.js"></script>
  <script src="js/core/FX.js"></script>

  <!-- entities + systems -->
  <script src="js/entities/Ball.js"></script>
  <script src="js/entities/Player.js"></script>
  <script src="js/entities/Goal.js"></script>
  <script src="js/entities/Shadow.js"></script>
  <script src="js/systems/InputSystem.js"></script>
  <script src="js/systems/AIBrain.js"></script>
  <script src="js/systems/MatchRules.js"></script>

  <!-- ui + scenes -->
  <script src="js/ui/Paint.js"></script>
  <script src="js/ui/Widgets.js"></script>
  <script src="js/ui/SkyLife.js"></script>
  <script src="js/ui/Stadium.js"></script>
  <script src="js/ui/TouchControls.js"></script>
  <script src="js/ui/Emotes.js"></script>
  <script src="js/ui/HUD.js"></script>
  <script src="js/scenes/Boot.js"></script>
  <script src="js/scenes/Menu.js"></script>
  <script src="js/scenes/CharSelect.js"></script>
  <script src="js/scenes/Match.js"></script>
  <script src="js/scenes/Pause.js"></script>
  <script src="js/scenes/Settings.js"></script>
  <script src="js/scenes/Result.js"></script>
  <script src="js/scenes/Credits.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
